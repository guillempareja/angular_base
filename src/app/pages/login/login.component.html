<form class="box" [formGroup]="form" (ngSubmit)="handleLogin()">
  <h1>{{ 'login.title' | translate }}</h1>

  <div class="grid-template">
    <!-- User -->
    <div>
      <label for="login-input-username">{{
        'login.usernameLabel' | translate
      }}</label>
      <input
        id="login-input-username"
        type="text"
        [placeholder]="'login.usernamePlaceholder' | translate"
        [class.is-invalid]="form | isInvalidControl: 'username'"
        formControlName="username"
      />
      @if (form | isInvalidControl: 'username') {
        <div class="invalid-feedback">
          {{ form.get('username')! | errorMessage }}
        </div>
      }
    </div>

    <!-- Password -->
    <div>
      <label for="login-input-password">{{
        'login.passwordLabel' | translate
      }}</label>
      <input
        id="login-input-password"
        type="password"
        [placeholder]="'login.passwordPlaceholder' | translate"
        [class.is-invalid]="form | isInvalidControl: 'password'"
        formControlName="password"
      />
      @if (form | isInvalidControl: 'password') {
        <div class="invalid-feedback">
          {{ form.get('password')! | errorMessage }}
        </div>
      }
    </div>
  </div>

  <button id="login-btn-submit" type="submit">
    {{ 'login.submitButton' | translate }}
  </button>
</form>
